name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1. 변경된 앱 감지 (pullim 패턴 — bun 워크스페이스 정렬)
  # packages/** 또는 root 설정 변경 시 → 양쪽 모두 영향
  # ─────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      planner: ${{ steps.filter.outputs.planner }}
      backend: ${{ steps.filter.outputs.backend }}
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        # main push 이벤트에서도 paths-filter가 이전 커밋과 git diff 계산 가능하도록 전체 이력 fetch
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            planner:
              - 'apps/planner/**'
              - 'packages/**'
              - 'tsconfig.base.json'
              - 'turbo.json'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/**'
            backend:
              - 'apps/backend/**'
              - 'packages/**'
              - 'tsconfig.base.json'
              - 'turbo.json'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/**'
            packages:
              - 'packages/**'
              - 'tsconfig.base.json'
              - 'turbo.json'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/**'

  # ─────────────────────────────────────────────────────────────
  # Job 2. Lint & Typecheck (영향받은 앱만 / turbo --filter 병렬)
  # ─────────────────────────────────────────────────────────────
  validate:
    name: validate (typecheck + lint)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.planner == 'true' ||
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.packages == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # packages/** 변경 시 packages 워크스페이스 자체도 typecheck 대상에 추가 —
      # 두 앱이 packages를 아직 직접 참조하지 않아도 packages 내부 타입 오류 검출
      - name: Typecheck (affected)
        run: |
          FILTER=""
          if [ "${{ needs.detect-changes.outputs.planner }}" = "true" ]; then
            FILTER="$FILTER --filter=@pullim-planner/planner"
          fi
          if [ "${{ needs.detect-changes.outputs.backend }}" = "true" ]; then
            FILTER="$FILTER --filter=@pullim-planner/backend"
          fi
          if [ "${{ needs.detect-changes.outputs.packages }}" = "true" ]; then
            FILTER="$FILTER --filter=@pullim-planner/types --filter=@pullim-planner/api-client --filter=@pullim-planner/auth"
          fi
          bunx turbo typecheck $FILTER

      - name: Lint (affected)
        # packages는 아직 lint script 없음 — Phase β에서 도입 예정
        if: >-
          needs.detect-changes.outputs.planner == 'true' ||
          needs.detect-changes.outputs.backend == 'true'
        run: |
          FILTER=""
          if [ "${{ needs.detect-changes.outputs.planner }}" = "true" ]; then
            FILTER="$FILTER --filter=@pullim-planner/planner"
          fi
          if [ "${{ needs.detect-changes.outputs.backend }}" = "true" ]; then
            FILTER="$FILTER --filter=@pullim-planner/backend"
          fi
          bunx turbo lint $FILTER

  # ─────────────────────────────────────────────────────────────
  # Job 3. Build (영향받은 앱만)
  # ─────────────────────────────────────────────────────────────
  build:
    name: build (Next.js + NestJS)
    needs: [detect-changes, validate]
    runs-on: ubuntu-latest
    if: >-
      needs.detect-changes.outputs.planner == 'true' ||
      needs.detect-changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build (affected)
        run: |
          FILTER=""
          if [ "${{ needs.detect-changes.outputs.planner }}" = "true" ]; then
            FILTER="$FILTER --filter=@pullim-planner/planner"
          fi
          if [ "${{ needs.detect-changes.outputs.backend }}" = "true" ]; then
            FILTER="$FILTER --filter=@pullim-planner/backend"
          fi
          bunx turbo build $FILTER

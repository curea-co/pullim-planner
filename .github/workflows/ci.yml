name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# package.json 의 `packageManager: bun@1.3.12` 와 일치시킴 —
# `latest` 사용 시 Bun 업데이트만으로 lockfile 해석이 비결정적으로 깨질 수 있음
env:
  BUN_VERSION: "1.3.12"

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1. Lint & Typecheck & Test
  # ─────────────────────────────────────────────────────────────
  validate:
    name: validate (typecheck + lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

  # ─────────────────────────────────────────────────────────────
  # Job 2. Build (Next.js standalone)
  # ─────────────────────────────────────────────────────────────
  build:
    name: build (Next.js)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
